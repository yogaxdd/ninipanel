<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backups - NiniPanel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .backup-card {
            display: grid;
            grid-template-columns: 1fr auto auto auto auto;
            gap: var(--spacing-lg);
            align-items: center;
            padding: var(--spacing-lg);
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-fast);
        }

        .backup-card:hover {
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .backup-card {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }

        .backup-info h4 {
            margin: 0 0 var(--spacing-xs);
            font-weight: 600;
        }

        .backup-info p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .backup-size {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .backup-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .backup-status {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .backup-status.completed {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .backup-status.creating {
            background: rgba(251, 191, 36, 0.1);
            color: var(--warning);
        }

        .backup-status.failed {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .backup-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .backup-actions button {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all var(--transition-fast);
        }

        .btn-download {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info);
        }

        .btn-restore {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .backup-actions button:hover {
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
        }

        .create-backup-section {
            background: var(--glass-bg);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .server-tab {
            padding: var(--spacing-sm) var(--spacing-lg);
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all var(--transition-fast);
        }

        .server-tab:hover {
            border-color: var(--primary);
        }

        .server-tab.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-top: var(--spacing-sm);
        }

        .progress-bar .progress {
            height: 100%;
            background: var(--primary);
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <a href="../index.html" class="sidebar-brand">
                <span>🚀</span>
                <span class="text-gradient">NiniPanel</span>
            </a>

            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="servers.html">🖥️ Server Saya</a></li>
                <li><a href="console.html">💻 Console</a></li>
                <li><a href="files.html">📁 File Manager</a></li>
                <li><a href="startup.html">⚙️ Startup</a></li>
                <li><a href="backups.html" class="active">💾 Backups</a></li>
            </ul>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Akun</div>
                <ul class="sidebar-menu">
                    <li><a href="billing.html">💳 Billing</a></li>
                    <li><a href="support.html">🎫 Support</a></li>
                    <li><a href="#" onclick="API.logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>💾 Backups</h1>
                <p>Kelola backup untuk VPS Anda</p>
            </div>

            <div class="server-selector" id="serverSelector"
                style="display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-lg); flex-wrap: wrap;">
                <div style="color: var(--text-secondary);">Pilih server:</div>
            </div>

            <div id="backupsContainer">
                <div class="card" style="text-align: center; padding: var(--spacing-3xl);">
                    <div style="font-size: 4rem; margin-bottom: var(--spacing-lg);">💾</div>
                    <h3 style="margin-bottom: var(--spacing-sm);">Tidak Ada Server</h3>
                    <p style="color: var(--text-secondary);">Anda belum memiliki VPS aktif.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Check login
        if (!API.isLoggedIn()) {
            window.location.href = '../auth/login.html';
        }

        const user = API.getUser();
        let selectedServer = null;
        let backups = [];

        // Load servers
        async function loadServers() {
            try {
                const result = await API.getServers();
                const servers = result.success ? result.servers : [];
                const selector = document.getElementById('serverSelector');

                if (servers.length === 0) return;

                selector.innerHTML = '<div style="color: var(--text-secondary);">Pilih server:</div>' +
                    servers.map(server => `
                <div class="server-tab" data-server="${server.id}">
                    <span class="vps-status ${server.status}"><span class="dot"></span></span>
                    <span>${server.name || 'VPS-' + server.id.substring(0, 6).toUpperCase()}</span>
                </div>
            `).join('');

                selector.querySelectorAll('.server-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        selector.querySelectorAll('.server-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        selectedServer = servers.find(s => s.id === tab.dataset.server);
                        loadBackups();
                    });
                });

                // Auto-select first
                if (servers[0]) {
                    selectedServer = servers[0];
                    selector.querySelector('.server-tab').classList.add('active');
                    loadBackups();
                }
            } catch (err) {
                console.error('Failed to load servers:', err);
            }
        }

        async function loadBackups() {
            if (!selectedServer) return;

            document.getElementById('backupsContainer').innerHTML = '<div style="text-align:center; padding: 2rem;">Loading backups...</div>';

            try {
                const result = await API.getBackups(selectedServer.id);
                backups = result.success ? result.backups : [];
                renderBackups();
            } catch (err) {
                console.error('Failed to load backups:', err);
                document.getElementById('backupsContainer').innerHTML = `
                 <div class="card" style="text-align: center; padding: var(--spacing-3xl);">
                    <div style="font-size: 4rem; margin-bottom: var(--spacing-lg);">❌</div>
                    <h3 style="margin-bottom: var(--spacing-sm);">Error Loading Backups</h3>
                    <p style="color: var(--text-secondary);">${err.message}</p>
                 </div>`;
            }
        }

        function renderBackups() {
            const container = document.getElementById('backupsContainer');

            container.innerHTML = `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                    <h3 class="section-title">Backups (${backups.length})</h3>
                    <button class="btn btn-primary btn-sm" onclick="createBackup()">➕ Create Backup</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Size</th>
                                <th>Created At</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${backups.length > 0 ? backups.map(backup => `
                                <tr>
                                    <td>
                                        <div style="font-weight: 500;">${escapeHtml(backup.name)}</div>
                                        <div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">${backup.id.substring(0, 8)}</div>
                                    </td>
                                    <td>${formatSize(backup.size)}</td>
                                    <td>${formatDate(backup.createdAt)}</td>
                                    <td>
                                        <span class="badge badge-${backup.status === 'completed' ? 'success' : (backup.status === 'failed' ? 'danger' : 'warning')}">
                                            ${backup.status}
                                        </span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            ${backup.status === 'completed' ? `
                                            <button class="btn btn-secondary btn-sm" onclick="restoreBackup('${backup.id}')" title="Restore">↺</button>
                                            <button class="btn btn-secondary btn-sm" onclick="window.location.href='/api/backups/${backup.id}/download?token=${API.token}'" title="Download">⬇️</button>
                                            ` : ''}
                                            <button class="btn btn-secondary btn-sm" style="color: var(--danger); border-color: var(--danger);" onclick="deleteBackup('${backup.id}')" title="Delete">🗑️</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('') : '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No backups found.</td></tr>'}
                        </tbody>
                    </table>
                </div>
                
                <div style="margin-top: var(--spacing-md); font-size: 0.875rem; color: var(--text-secondary);">
                    ℹ️ Backups consume your disk space quota. Delete old backups to free up space.
                </div>
            </div>
        `;
        }

        // Helper to get token for download link above if needed, but API.token is not exposed directly.
        // API.token is internal to API class usually, but I exported it?
        // Let's check api.js. It has `get token()`.
        // Wait, `API` is an instance of `APIClient`.
        // I need to check if `token` getter exists. `js/api.js`: `get token() { return localStorage.getItem('ninipanel_token'); }`
        // So `API.token` works.

        async function createBackup() {
            const name = prompt('Enter backup name (optional):');
            if (name === null) return; // Cancelled

            try {
                const result = await API.createBackup(selectedServer.id, name);
                if (result.success) {
                    alert('Backup creation started!');
                    loadBackups();
                } else {
                    alert('Failed to create backup: ' + result.message);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function restoreBackup(backupId) {
            if (!confirm('⚠️ Are you sure you want to restore this backup? Current files will be overwritten.')) {
                return;
            }

            try {
                const result = await API.restoreBackup(backupId);
                if (result.success) {
                    alert('✅ Backup restored successfully!');
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteBackup(backupId) {
            if (!confirm('⚠️ Are you sure you want to delete this backup? This cannot be undone.')) {
                return;
            }

            try {
                const result = await API.deleteBackup(backupId);
                if (result.success) {
                    alert('✅ Backup deleted!');
                    loadBackups();
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadServers();
    </script>
</body>

</html>
